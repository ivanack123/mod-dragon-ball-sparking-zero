name: Informar de un fallo
description: El juego se cierra, algo no se lee, o el lector va lento
title: "[Fallo] "
labels: ["fallo"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por avisar. Cuanto más concreto seas, antes se puede arreglar.

        Lo más útil de todo son los archivos de diagnóstico: dicen exactamente en qué
        estaba trabajando el mod en el momento del fallo. Están en la carpeta del juego,
        en `Binaries\Win64\AE_debug`.

  - type: dropdown
    id: tipo
    attributes:
      label: ¿Qué ha pasado?
      options:
        - El juego se cerró solo
        - Algo no se lee o se quedó mudo
        - El lector va lento o da tirones
        - Lee algo equivocado
        - Otra cosa
    validations:
      required: true

  - type: textarea
    id: donde
    attributes:
      label: ¿Dónde y cuándo pasó?
      description: La pantalla concreta y qué estabas haciendo justo antes. Cuanto más exacto, mejor.
      placeholder: |
        Ejemplo: entré a la Enciclopedia desde el menú principal y el juego se cerró
        justo al cargar la pantalla.
    validations:
      required: true

  - type: checkboxes
    id: repite
    attributes:
      label: ¿Se repite?
      options:
        - label: Me ha pasado más de una vez
        - label: Me pasa siempre que hago lo mismo

  - type: textarea
    id: diagnostico
    attributes:
      label: Archivos de diagnóstico
      description: |
        Arrastra aquí los archivos de `Binaries\Win64\AE_debug`. Los que más ayudan son
        `ae_livelog.txt` y los tres que empiezan por `ae_crumb`. Si el juego se cerró, no
        abras el juego de nuevo antes de copiarlos: al arrancar se reinician.
      placeholder: Arrastra los archivos a este cuadro.

  - type: input
    id: version
    attributes:
      label: Versión del mod
      placeholder: "1.1.0"

  - type: textarea
    id: extra
    attributes:
      label: Cualquier otra cosa
      description: Lector de pantalla que usas, si el juego se actualizó hace poco, o lo que quieras añadir.
